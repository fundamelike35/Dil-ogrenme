<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Script - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0033, #3b0066);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 340px;
            background: rgba(43, 0, 79, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #f3c6ff;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #e9d5ff;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #c084fc;
        }

        .error-msg {
            display: none;
            color: #ff8fa3;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #9333ea, #7e22ce);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            font-size: 0.8rem;
            color: #c084fc;
            position: relative;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: #ffffff;
            border: none;
            border-radius: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background: #f1f1f1;
        }

        .google-icon {
            color: #ea4335;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="welcome-title">Hoş Geldiniz</h1>
        <p class="subtitle">Dünya alfabelerini keşfetmek için giriş yapın.</p>
        
        <form id="loginForm" onsubmit="event.preventDefault(); validateAndProceed();">
            <div class="input-group">
                <label>Adınız</label>
                <input type="text" id="fname" placeholder="Örn: Melike" oninput="hideError('nameError')">
                <span id="nameError" class="error-msg">Lütfen adınızı girin</span>
            </div>
            
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="pass" placeholder="Şifrenizi girin" oninput="hideError('passError')">
                <span id="passError" class="error-msg">Lütfen şifre belirleyin</span>
            </div>

            <button type="submit" class="btn-primary">Devam Et</button>
        </form>

        <div class="divider">veya</div>

        <button type="button" class="btn-google" onclick="loginWithGoogle()">
            <span class="google-icon">G</span> Google ile Giriş Yap
        </button>
    </div>

    <script>
        function hideError(id) {
            const err = document.getElementById(id);
            if (err) err.style.display = 'none';
        }

        function validateAndProceed() {
            const fnameInput = document.getElementById('fname');
            const passInput = document.getElementById('pass');
            
            const fname = fnameInput ? fnameInput.value.trim() : "";
            const pass = passInput ? passInput.value.trim() : "";
            let valid = true;

            if (!fname) {
                document.getElementById('nameError').style.display = 'block';
                valid = false;
            }

            if (!pass) {
                document.getElementById('passError').style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            alert("Başarılı! Validasyon geçti.");
        }

        function loginWithGoogle() {
            const accounts = [
                { name: "Melike Yılmaz", email: "melike.yilmaz@gmail.com" },
                { name: "Global Kullanıcı", email: "global.script@gmail.com" }
            ];

            let promptText = "Google Hesabı Seçin:\n\n";
            accounts.forEach((acc, index) => {
                promptText += `${index + 1}. ${acc.name} (${acc.email})\n`;
            });

            let choice = prompt(promptText + "\nLütfen 1 veya 2 seçin:");
            if (choice === null) return;

            let selected = accounts[0];
            if (choice === "2") selected = accounts[1];

            document.getElementById('fname').value = selected.name.split(' ')[0];
            document.getElementById('pass').value = "GoogleAuth123!";
            
            hideError('nameError');
            hideError('passError');
            
            alert(selected.name + " ile giriş yapıldı!");
        }
    </script>
</body>
</html>
