<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Script - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0033, #3b0066);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 340px;
            background: rgba(43, 0, 79, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #f3c6ff;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #e9d5ff;
        }

        .input-group input {
            width: 100%;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #c084fc;
        }

        .error-msg {
            display: none;
            color: #ff8fa3;
            font-size: 0.75rem;
            margin-top: 3px;
        }

        .btn-primary {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #9333ea, #7e22ce);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .divider {
            text-align: center;
            margin: 12px 0;
            font-size: 0.8rem;
            color: #c084fc;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: #ffffff;
            border: none;
            border-radius: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background: #f1f1f1;
        }

        .google-icon {
            color: #ea4335;
            font-weight: bold;
        }

        /* ŞIK GOOGLE HESAP SEÇİM PENCERESİ (MODAL) */
        .google-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .google-modal-content {
            background: #2d004d;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            width: 90%;
            max-width: 320px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
        }

        .google-modal-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .account-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .account-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .account-avatar {
            width: 35px; height: 35px;
            background: #9333ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
        }

        .account-info .name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }

        .account-info .email {
            font-size: 0.72rem;
            color: #d8b4fe;
        }

        .modal-close {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #d8b4fe;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .modal-close:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="welcome-title">Hoş Geldiniz</h1>
        <p class="subtitle">Dünya alfabelerini keşfetmek için giriş yapın.</p>
        
        <form id="loginForm" onsubmit="event.preventDefault(); validateAndProceed();">
            <div class="input-group">
                <label>Adınız</label>
                <input type="text" id="fname" placeholder="Örn: Melike" oninput="hideError('nameError')">
                <span id="nameError" class="error-msg">Lütfen adınızı girin</span>
            </div>
            
            <div class="input-group">
                <label>Soyadınız</label>
                <input type="text" id="lname" placeholder="Örn: Yılmaz">
            </div>

            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="pass" placeholder="Şifrenizi girin" oninput="hideError('passError')">
                <span id="passError" class="error-msg">Lütfen şifre belirleyin</span>
            </div>

            <button type="submit" class="btn-primary">Devam Et</button>
        </form>

        <div class="divider">veya</div>

        <button type="button" class="btn-google" onclick="openGoogleModal()">
            <span class="google-icon">G</span> Google ile Giriş Yap
        </button>
    </div>

    <!-- GOOGLE HESAP SEÇİM PENCERESİ (MODAL) -->
    <div id="googleModal" class="google-modal">
        <div class="google-modal-content">
            <div class="google-modal-header">Google ile Devam Et</div>
            
            <div class="account-item" onclick="selectGoogleAccount('Melike', 'Yılmaz', 'melike.yilmaz@gmail.com')">
                <div class="account-avatar">M</div>
                <div class="account-info">
                    <div class="name">Melike Yılmaz</div>
                    <div class="email">melike.yilmaz@gmail.com</div>
                </div>
            </div>

            <div class="account-item" onclick="selectGoogleAccount('Global', 'Kullanıcı', 'global.script35@gmail.com')">
                <div class="account-avatar">G</div>
                <div class="account-info">
                    <div class="name">Global Kullanıcı</div>
                    <div class="email">global.script35@gmail.com</div>
                </div>
            </div>

            <button type="button" class="modal-close" onclick="closeGoogleModal()">İptal</button>
        </div>
    </div>

    <script>
        function hideError(id) {
            const err = document.getElementById(id);
            if (err) err.style.display = 'none';
        }

        function validateAndProceed() {
            const fnameInput = document.getElementById('fname');
            const passInput = document.getElementById('pass');
            
            const fname = fnameInput ? fnameInput.value.trim() : "";
            const pass = passInput ? passInput.value.trim() : "";
            let valid = true;

            if (!fname) {
                document.getElementById('nameError').style.display = 'block';
                valid = false;
            }

            if (!pass) {
                document.getElementById('passError').style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            alert("Başarılı! Form doğrulandı ve geçiş yapılıyor.");
        }

        // Google Modal Açma / Kapatma Fonksiyonları
        function openGoogleModal() {
            document.getElementById('googleModal').style.display = 'flex';
        }

        function closeGoogleModal() {
            document.getElementById('googleModal').style.display = 'none';
        }

        // Hesaba tıklandığında formu otomatik doldurma
        function selectGoogleAccount(name, surname, email) {
            document.getElementById('fname').value = name;
            document.getElementById('lname').value = surname;
            document.getElementById('pass').value = "GoogleAuth_" + Math.floor(1000 + Math.random() * 9000) + "!";
            
            hideError('nameError');
            hideError('passError');
            closeGoogleModal();
            
            alert(name + " " + surname + " (" + email + ") hesabı ile başarıyla giriş yapıldı!");
        }
    </script>
</body>
</html>
