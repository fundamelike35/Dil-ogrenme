<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Script - Giriş</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:ital,wght@1,600&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Harici Style Bağlantısı -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Arka Planda Dağınık ve Gölgesiz Alfabeler -->
    <div class="bg-floating-words">
        <span class="word w1">한국어</span>
        <span class="word w2">Español</span>
        <span class="word w3">Ελληνικά</span>
        <span class="word w4">日本語</span>
        <span class="word w5">Русский</span>
        <span class="word w6">Göktürk</span>
        <span class="word w7">Hangeul</span>
        <span class="word w8">Français</span>
    </div>

    <!-- Üst Navbar (Yeşil-Mavi-Mor Geçişli ve Dokulu) -->
    <header class="navbar">
        <div class="logo-text">
            <span>🌐</span> Global<strong>Script</strong>
        </div>
    </header>

    <main class="main-container">
        <div class="login-card">
            <h1 class="welcome-title">Hoş Geldiniz</h1>
            <p class="subtitle">Dünya alfabelerini keşfetmek için giriş yapın.</p>
            
            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="fname">Adınız</label>
                    <input type="text" id="fname" placeholder="Örn: Melike" autocomplete="given-name">
                    <span id="nameError" class="error-msg">Lütfen adınızı girin</span>
                </div>
                
                <div class="input-group">
                    <label for="lname">Soyadınız <span class="optional">(isteğe bağlı)</span></label>
                    <input type="text" id="lname" placeholder="Örn: Yılmaz" autocomplete="family-name">
                </div>

                <div class="input-group">
                    <div class="label-with-action">
                        <label for="pass">Şifre</label>
                        <button type="button" id="suggestPassBtn" class="suggest-btn">Akıllı Şifre Öner</button>
                    </div>
                    <div class="password-wrapper">
                        <input type="password" id="pass" placeholder="Şifrenizi girin" autocomplete="current-password">
                        <button type="button" id="togglePassBtn" class="toggle-password" aria-label="Şifreyi Göster/Gizle">
                            <svg id="eyeIcon" viewBox="0 0 24 24">
                                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>
                            </svg>
                        </button>
                    </div>
                    <span id="passError" class="error-msg">Lütfen şifre belirleyin</span>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Devam Et</button>
            </form>
